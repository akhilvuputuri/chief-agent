name: setup kite
description: >-
  Node 22.23.4, the kite release pinned in tools/kite.json (checksum
  verified) and its package store. npm and npx are removed from the PATH so
  nothing can fall back to them.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: "22.23.4" }
    - name: Install kite and remove npm
      shell: bash
      run: |
        dir="$RUNNER_TEMP/kite-bin"
        node tools/install-kite.mjs --dir "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        echo "KITE_STORE=$RUNNER_TEMP/kite-store" >> "$GITHUB_ENV"
        # Remove every npm on the PATH (setup-node's and the runner image's).
        for tool in npm npx corepack; do
          for found in $(type -ap "$tool"); do
            sudo rm -f "$found"
          done
        done
        hash -r
        if command -v npm || command -v npx; then
          echo "npm is still on the PATH" >&2
          exit 1
        fi
        "$dir/kite" --version
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/kite-store
        key: kite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/kite.json', 'package-lock.json', 'coding_runtime_pi/package-lock.json') }}
        restore-keys: kite-${{ runner.os }}-${{ runner.arch }}-
