name: coding-worker-image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the trusted worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.coding
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}-coding:${{ github.sha }}
      - name: Record the immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'Worker image: `ghcr.io/%s-coding@%s`\n' "$REPOSITORY" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
