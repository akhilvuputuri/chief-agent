name: production-diagnostics
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.repository == 'akhilvuputuri/companion-agent' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.comment.body == '/companion diagnose' &&
        github.actor == github.event.comment.user.login &&
        ((github.event.comment.user.login == github.repository_owner && github.event.comment.user.type == 'User') ||
         (github.event.comment.user.id == 158243242 && github.event.comment.user.login == 'devin-ai-integration[bot]' && github.event.comment.user.type == 'Bot'))))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: companion-diagnostics
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Read bounded production diagnostics
        env:
          DEPLOY_KEY: ${{ secrets.COMPANION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.COMPANION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/companion
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/companion ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/companion' EXIT
          ssh -i ~/.ssh/companion -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes root@188.166.246.143 diagnose

      - name: Link diagnostics result
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          DIAGNOSTICS_RESULT: ${{ job.status }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `Bounded production diagnostics: **${process.env.DIAGNOSTICS_RESULT}**. [Private Actions output](${url}). No raw conversation or credential content is included. A successful command is not proof of feature correctness.`
            });
