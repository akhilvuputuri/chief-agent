name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - name: Build and inspect the disposable coding worker
        run: |
          docker build -f Dockerfile.coding -t chief-coding:test .
          docker run --rm --entrypoint sh chief-coding:test -c 'test "$(id -u)" != 0 && node --version && git --version && rg --version && python3 --version'
          docker run --rm --user root --env CODING_TEST_SECRET=synthetic --entrypoint setpriv chief-coding:test --reuid=node --regid=node --clear-groups --no-new-privs --bounding-set=-all node --disable-sigusr1 /opt/chief-worker/security-smoke.mjs
