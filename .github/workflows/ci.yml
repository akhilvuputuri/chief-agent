name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.19.0", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install repository search dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: python -m pip install --require-hashes -r coding_runtime/requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - name: Build and inspect the disposable coding worker
        run: |
          docker build -f Dockerfile.coding -t chief-coding:test .
          docker run --rm --entrypoint sh chief-coding:test -c 'test "$(id -u)" != 0 && node --version && git --version && rg --version && python3 --version'
          docker run --rm --user root --env CODING_TEST_SECRET=synthetic --entrypoint setpriv chief-coding:test --reuid=1000 --regid=1000 --clear-groups --no-new-privs --bounding-set=-all python -I -m chief_coding_runtime.security_smoke
      - name: Verify Pi package independence and actual Linux worker boundary
        run: |
          npm --prefix coding_runtime_pi ci --ignore-scripts
          npm --prefix coding_runtime_pi run check
          docker build -f Dockerfile.coding-pi -t chief-pi:test .
          docker run --rm --user root --env CODING_TEST_SECRET=synthetic --entrypoint setpriv chief-pi:test --reuid=1000 --regid=1000 --clear-groups --no-new-privs --bounding-set=-all node --disable-sigusr1 /opt/chief-worker/coding_runtime_pi/dist/security-smoke.js
          cp -R coding_runtime_pi /tmp/pi-runtime-independent
          cd /tmp/pi-runtime-independent
          npm ci --ignore-scripts
          npm run check
      - name: Verify isolated browser sandbox with synthetic pages
        run: |
          docker build -f Dockerfile.browser --target browser -t chief-browser:test .
          docker run --rm --init --network=none --read-only --tmpfs /tmp:size=192m,mode=1777 --shm-size=192m --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=deploy/browser/seccomp.json --memory=640m --pids-limit=192 --entrypoint node chief-browser:test /app/browser-smoke.mjs

      - name: Verify PostgreSQL gathering revocation interleaving
        run: |
          docker build -t chief-gathering-app:test .
          docker run -d --name gathering-pg-proof --network=none --user postgres --read-only --tmpfs /tmp:size=256m,mode=1777 --tmpfs /var/run/postgresql:mode=1777 --memory=384m --pids-limit=96 --env PGDATA=/tmp/pgdata --env POSTGRES_USER=synthetic --env POSTGRES_PASSWORD=synthetic-only --env POSTGRES_DB=gathering_test postgres:17-alpine
          trap 'docker rm -f gathering-pg-proof >/dev/null' EXIT
          pg_ready=false
          for i in $(seq 1 30); do
            if docker exec gathering-pg-proof pg_isready -h 127.0.0.1 -U synthetic -d gathering_test; then pg_ready=true; break; fi
            sleep 1
          done
          if [ "$pg_ready" != true ]; then echo 'Disposable PostgreSQL TCP readiness timed out' >&2; exit 1; fi
          docker run --rm --network=container:gathering-pg-proof --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=384m --pids-limit=96 --env GATHERING_TEST_DATABASE_URL=postgresql://synthetic:synthetic-only@127.0.0.1:5432/gathering_test --mount type=bind,source="$PWD/db",target=/app/db,readonly --mount type=bind,source="$PWD/scripts/gathering-postgres-smoke.mjs",target=/app/scripts/gathering-postgres-smoke.mjs,readonly --entrypoint node chief-gathering-app:test /app/scripts/gathering-postgres-smoke.mjs
