name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The jobs below run in parallel and together cover `kite run format:check`, `kite run check`
# and `kite run build`. Branch protection requires the `test` job, which passes only when
# every other job passed; the release workflow requires the whole workflow to succeed.
jobs:
  static:
    name: format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kite
      - run: kite ci
      - run: kite run format:check
      - run: kite run typecheck
  tests:
    name: tests ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coding_runtime/requirements-dev.txt
      - uses: ./.github/actions/setup-ripgrep
      - run: python -m pip install --require-hashes -r coding_runtime/requirements-dev.txt
      - run: kite ci
      # Transpile only: `format and types` checks types, and this job only runs the tests.
      - run: kite run build:image
      - run: kite run test:ts
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
  other:
    name: scripts, evals and Python runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coding_runtime/requirements-dev.txt
      - uses: ./.github/actions/setup-ripgrep
      - run: python -m pip install --require-hashes -r coding_runtime/requirements-dev.txt
      - run: kite ci
      - run: kite run build
      - run: kite run test:other
      - run: kite run check:coding
  pi:
    name: Pi package and worker boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kite
      - uses: ./.github/actions/setup-ripgrep
      - run: kite ci
      - run: kite run build
      # Before Pi's own `kite ci`: the images install Pi's dependencies from the root lockfile.
      - run: kite run check:pi
      - name: Verify Pi package independence and actual Linux worker boundary
        run: |
          kite --prefix coding_runtime_pi ci --ignore-scripts
          docker build -f Dockerfile.coding-pi -t chief-pi:test .
          docker build --build-context kite=tools -t pi-runtime-standalone:test coding_runtime_pi
          node scripts/pi-cli-container-smoke.mjs
          docker run --rm --user root --env CODING_TEST_SECRET=synthetic --entrypoint setpriv chief-pi:test --reuid=1000 --regid=1000 --clear-groups --no-new-privs --bounding-set=-all node --disable-sigusr1 /opt/chief-worker/coding_runtime_pi/dist/security-smoke.js
          CHIEF_BOX_DOCKER_IMAGE=chief-pi:test kite exec tsx --test tests/box-docker.test.ts
          cp -R coding_runtime_pi /tmp/pi-runtime-independent
          # Pi's own lockfile, with no parent node_modules to fall back on.
          cd /tmp/pi-runtime-independent
          kite ci --ignore-scripts
          kite run check
  images:
    name: sandbox and app images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect the disposable coding worker
        run: |
          docker build -f Dockerfile.coding -t chief-coding:test .
          docker run --rm --entrypoint sh chief-coding:test -c 'test "$(id -u)" != 0 && node --version && git --version && rg --version && python3 --version'
          docker run --rm --user root --env CODING_TEST_SECRET=synthetic --entrypoint setpriv chief-coding:test --reuid=1000 --regid=1000 --clear-groups --no-new-privs --bounding-set=-all python -I -m chief_coding_runtime.security_smoke
      - name: Verify isolated browser sandbox with synthetic pages
        run: |
          docker build -f Dockerfile.browser --target browser -t chief-browser:test .
          docker run --rm --init --network=none --read-only --tmpfs /tmp:size=192m,mode=1777 --shm-size=192m --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=deploy/browser/seccomp.json --memory=640m --pids-limit=192 --entrypoint node chief-browser:test /app/browser-smoke.mjs
      - name: Verify PostgreSQL gathering revocation interleaving and session drops
        run: |
          docker build -t chief-gathering-app:test .
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint node chief-gathering-app:test --input-type=module -e 'await import("./dist/coding/schema.js"); await import("./dist/coding/controller.js"); await import("./dist/coding/api.js"); const {reportDocument}=await import("@chief-agent/pi-runtime/report"); if(reportDocument({kind:"plan",summary:"Synthetic production dependency check",detail:"x".repeat(9357)}).version!==1)throw Error("Report contract unavailable"); console.log("Pruned production coding modules and report contract loaded");'
          docker run -d --name gathering-pg-proof --network=none --user postgres --read-only --tmpfs /tmp:size=256m,mode=1777 --tmpfs /var/run/postgresql:mode=1777 --memory=384m --pids-limit=96 --env PGDATA=/tmp/pgdata --env POSTGRES_USER=synthetic --env POSTGRES_PASSWORD=synthetic-only --env POSTGRES_DB=gathering_test postgres:17-alpine
          trap 'docker rm -f gathering-pg-proof >/dev/null' EXIT
          pg_ready=false
          for i in $(seq 1 30); do
            if docker exec gathering-pg-proof pg_isready -h 127.0.0.1 -U synthetic -d gathering_test; then pg_ready=true; break; fi
            sleep 1
          done
          if [ "$pg_ready" != true ]; then echo 'Disposable PostgreSQL TCP readiness timed out' >&2; exit 1; fi
          docker run --rm --network=container:gathering-pg-proof --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=384m --pids-limit=96 --env GATHERING_TEST_DATABASE_URL=postgresql://synthetic:synthetic-only@127.0.0.1:5432/gathering_test --mount type=bind,source="$PWD/db",target=/app/db,readonly --mount type=bind,source="$PWD/scripts/gathering-postgres-smoke.mjs",target=/app/scripts/gathering-postgres-smoke.mjs,readonly --entrypoint node chief-gathering-app:test /app/scripts/gathering-postgres-smoke.mjs
          docker run --rm --network=container:gathering-pg-proof --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=384m --pids-limit=96 --env DB_DROP_TEST_DATABASE_URL=postgresql://synthetic:synthetic-only@127.0.0.1:5432/gathering_test --mount type=bind,source="$PWD/scripts/db-drop-postgres-smoke.mjs",target=/app/scripts/db-drop-postgres-smoke.mjs,readonly --entrypoint node chief-gathering-app:test /app/scripts/db-drop-postgres-smoke.mjs
  test:
    needs: [static, tests, other, pi, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
  gateway-image:
    name: publish gateway image
    # Main only, alongside the other jobs. The release deploys this exact image by
    # digest instead of building on the production host, and the release runs
    # only when the whole workflow, this job included, succeeded.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Actions pinned by commit: this job builds the production image and signs it.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the gateway image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/${{ github.repository }}-gateway:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}-gateway
        run: |
          printf 'Gateway image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
