services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["./db:/migrations:ro"]
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "companion",
        "-d",
        "companion",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/migrations/001_initial.sql",
        "-f",
        "/migrations/002_preparation.sql",
      ]
    depends_on:
      postgres: { condition: service_healthy }
  hermes:
    build:
      context: .
      dockerfile: services/hermes/Dockerfile
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-google/gemini-3.8-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      GATEWAY_URL: http://gateway:3000
    volumes: ["hermes-data:/data/hermes"]
    healthcheck:
      test:
        [
          "CMD",
          "/opt/hermes/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  gateway:
    build: .
    environment:
      DATABASE_URL: postgres://companion:${POSTGRES_PASSWORD}@postgres:5432/companion
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      HERMES_URL: http://hermes:8000
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHEETS_OWNER_USER_ID: ${SHEETS_OWNER_USER_ID:-}
      SHEETS_REFRESH_TOKEN: ${SHEETS_REFRESH_TOKEN:-}
      SHEETS_SPREADSHEET_ID: ${SHEETS_SPREADSHEET_ID:-}
      GMAIL_OWNER_USER_ID: ${GMAIL_OWNER_USER_ID:-}
      GMAIL_EMAIL: ${GMAIL_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-google/gemini-3.8-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      VOICE_REPLIES: ${VOICE_REPLIES:-false}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      hermes: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  postgres-data:
  hermes-data:
