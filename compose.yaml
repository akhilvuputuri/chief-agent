services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["./db:/migrations:ro"]
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "companion",
        "-d",
        "companion",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/migrations/001_initial.sql",
        "-f",
        "/migrations/002_preparation.sql",
        "-f",
        "/migrations/003_skills.sql",
        "-f",
        "/migrations/004_daily.sql",
        "-f",
        "/migrations/005_work.sql",
        "-f",
        "/migrations/006_runtime.sql",
        "-f",
        "/migrations/008_costs.sql",
        "-f",
        "/migrations/009_calendar_approval.sql",
        "-f",
        "/migrations/011_canvases.sql",
        "-f",
        "/migrations/012_message_storage.sql",
        "-f",
        "/migrations/013_conversation_control.sql",
        "-f",
        "/migrations/014_checkpoint_steering.sql",
        "-f",
        "/migrations/015_preparation_chain.sql",
        "-f",
        "/migrations/016_library.sql",
        "-f",
        "/migrations/017_routines.sql",
        "-f",
        "/migrations/018_watchlist.sql",
        "-f",
        "/migrations/019_parcels.sql",
        "-f",
        "/migrations/020_watch_window.sql",
        "-f",
        "/migrations/021_news.sql",
        "-f",
        "/migrations/022_telegram_delivery.sql",
        "-f",
        "/migrations/023_responsibilities.sql",
        "-f",
        "/migrations/024_coding.sql",
        "-f",
        "/migrations/025_subscriptions.sql",
        "-f",
        "/migrations/026_portfolio.sql",
        "-f",
        "/migrations/027_coding_squad.sql",
        "-f",
        "/migrations/028_gathering.sql",
        "-f",
        "/migrations/029_stock_rules.sql",
        "-f",
        "/migrations/030_mcp.sql",
        "-f",
        "/migrations/031_link_resolution.sql",
      ]
    depends_on:
      postgres: { condition: service_healthy }
  gateway:
    build: .
    environment:
      MCP_RUNTIME: ${MCP_RUNTIME:-off}
      MCP_CREDENTIALS_JSON: ${MCP_CREDENTIALS_JSON:-}
      GATHERING_RUNTIME: ${GATHERING_RUNTIME:-off}
      GATHERING_BROWSER: ${GATHERING_BROWSER:-off}
      GATHERING_ARTIFACT_KEY: ${GATHERING_ARTIFACT_KEY:-}
      GATHERING_BROWSER_KEY: ${GATHERING_BROWSER_KEY:-}
      CODING_RUNTIME: ${CODING_RUNTIME:-off}
      CODING_PUBLIC_ORIGIN: ${CODING_PUBLIC_ORIGIN:-}
      CODING_CODEBUILD_PROJECT: ${CODING_CODEBUILD_PROJECT:-}
      CODING_AWS_REGION: ${CODING_AWS_REGION:-ap-southeast-1}
      CODING_AUTH_KEY: ${CODING_AUTH_KEY:-}
      CODING_GITHUB_APP_ID: ${CODING_GITHUB_APP_ID:-}
      CODING_GITHUB_INSTALLATION_ID: ${CODING_GITHUB_INSTALLATION_ID:-}
      CODING_GITHUB_PRIVATE_KEY: ${CODING_GITHUB_PRIVATE_KEY:-}
      CODING_COMMIT_NAME: ${CODING_COMMIT_NAME:-}
      CODING_COMMIT_EMAIL: ${CODING_COMMIT_EMAIL:-}
      AWS_ACCESS_KEY_ID: ${CODING_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${CODING_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${CODING_AWS_SESSION_TOKEN:-}
      RESPONSIBILITIES: ${RESPONSIBILITIES:-off}
      IBKR_PORTFOLIO: ${IBKR_PORTFOLIO:-off}
      IBKR_TOKEN_KEY: ${IBKR_TOKEN_KEY:-}
      MINIAPP_ORIGIN: ${MINIAPP_ORIGIN:-}
      LIBRARY_IDENTITY_KEY: ${LIBRARY_IDENTITY_KEY:-}
      LIBRARY_HOLD_EMAIL: ${LIBRARY_HOLD_EMAIL:-}
      DATABASE_URL: postgres://companion:${POSTGRES_PASSWORD}@postgres:5432/companion
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS}
      STT_PROVIDER: ${STT_PROVIDER:-openai}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CALENDAR_REFRESH_TOKEN: ${CALENDAR_REFRESH_TOKEN:-}
      DAILY_SPREADSHEET_ID: ${DAILY_SPREADSHEET_ID:-}
      SHEETS_OWNER_USER_ID: ${SHEETS_OWNER_USER_ID:-}
      SHEETS_REFRESH_TOKEN: ${SHEETS_REFRESH_TOKEN:-}
      SHEETS_SPREADSHEET_ID: ${SHEETS_SPREADSHEET_ID:-}
      GMAIL_OWNER_USER_ID: ${GMAIL_OWNER_USER_ID:-}
      GMAIL_EMAIL: ${GMAIL_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-5.6-sol}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-medium}
      OPENROUTER_MAX_INPUT_PRICE: ${OPENROUTER_MAX_INPUT_PRICE:-2}
      OPENROUTER_MAX_OUTPUT_PRICE: ${OPENROUTER_MAX_OUTPUT_PRICE:-10}
      AGENT_BUDGET_MS: ${AGENT_BUDGET_MS:-900000}
      AGENT_BUDGET_MODEL_CALLS: ${AGENT_BUDGET_MODEL_CALLS:-40}
      AGENT_BUDGET_TOOL_CALLS: ${AGENT_BUDGET_TOOL_CALLS:-100}
      SEARCH_MODEL: ${SEARCH_MODEL:-google/gemini-3.8-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GMAIL_SECONDARY_EMAIL: ${GMAIL_SECONDARY_EMAIL:-}
      GMAIL_SECONDARY_REFRESH_TOKEN: ${GMAIL_SECONDARY_REFRESH_TOKEN:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      MARKET_DATA_EXTENDED: ${MARKET_DATA_EXTENDED:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      VOICE_REPLIES: ${VOICE_REPLIES:-false}
    ports: ["127.0.0.1:3000:3000"]
    networks: [default, browser-control]
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  gathering-proxy:
    profiles: [gathering]
    build: { context: ., dockerfile: Dockerfile.browser, target: proxy }
    image: chief-gathering-proxy
    networks: [browser-control, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  gathering-browser:
    profiles: [gathering]
    build: { context: ., dockerfile: Dockerfile.browser, target: browser }
    image: chief-gathering-browser
    environment:
      BROWSER_CONTROL_KEY: ${GATHERING_BROWSER_KEY:-}
      BROWSER_PROXY: http://gathering-proxy:3002
    networks: [browser-control]
    depends_on:
      gathering-proxy: { condition: service_healthy }
    init: true
    read_only: true
    tmpfs: ["/tmp:size=192m,mode=1777"]
    shm_size: 192m
    cap_drop: [ALL]
    security_opt:
      ["no-new-privileges:true", "seccomp:./deploy/browser/seccomp.json"]
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 192
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
networks:
  browser-control: { internal: true }
volumes:
  postgres-data:
