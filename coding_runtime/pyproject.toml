[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-coding-runtime"
version = "0.1.0"
description = "Isolated coding execution, artifacts and review over a versioned model gateway"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.12.0"]

[project.optional-dependencies]
dev = ["mypy==1.18.2", "ruff==0.13.2", "setuptools==80.9.0"]

[project.scripts]
chief-coding-worker = "chief_coding_runtime.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chief_coding_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
